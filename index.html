<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajaltoun — Vendor Order Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #eef1ef;
    --panel: #ffffff;
    --ink: #1b2430;
    --ink-dim: #5b6472;
    --line: #dde1de;
    --sidebar: #1b2430;
    --sidebar-ink: #c7cdd6;
    --sidebar-ink-active: #ffffff;
    --primary: #183F81;
    --primary-hover: #123468;
    --primary-soft: #eaf0f8;
    --primary-line: #c8d5e8;
    --amber: #d98e04;
    --amber-ink: #4a3200;
    --teal: #2a7f77;
    --red: #c1443c;
    --red-bg: #fbe9e7;
    --green: #3c8558;
    --green-bg: #e7f3ea;
    --slate: #6b7280;
    --slate-bg: #eef0f2;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; margin:0;}

  /* Sidebar */
  #sidebar{
    width:220px; flex-shrink:0; background:var(--sidebar); color:var(--sidebar-ink);
    display:flex; flex-direction:column; padding:24px 0; position:sticky; top:0; height:100vh;
  }
  .brand{padding:0 20px 24px 20px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:12px;}
  .brand-mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#fff; letter-spacing:0.3px;}
  .brand-sub{font-size:11px; color:var(--sidebar-ink); opacity:0.7; margin-top:2px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.5px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 20px; cursor:pointer;
    font-size:14px; font-weight:500; color:var(--sidebar-ink); border-left:3px solid transparent;
    transition:all .15s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .nav-item.active{background:rgba(24,63,129,0.22); color:var(--sidebar-ink-active); border-left-color:var(--primary);}
  .nav-icon{width:16px; text-align:center; opacity:0.85;}
  .nav-badge{
    margin-left:auto; background:var(--red); color:#fff; font-size:10px; font-family:'IBM Plex Mono',monospace;
    padding:1px 6px; border-radius:20px; font-weight:600;
  }
  .sidebar-footer{margin-top:auto; padding:16px 20px 0 20px; border-top:1px solid rgba(255,255,255,0.08);}
  .reset-link{font-size:11px; color:var(--sidebar-ink); opacity:0.55; cursor:pointer; text-decoration:underline;}
  .reset-link:hover{opacity:0.9;}

  /* Main */
  #main{flex:1; padding:32px 40px; max-width:1200px;}
  .page-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .page-title{font-size:26px; font-weight:700;}
  .page-sub{color:var(--ink-dim); font-size:13px; margin-top:4px;}

  .btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; border:none; border-radius:8px;
    padding:9px 16px; cursor:pointer; transition:all .12s ease; display:inline-flex; align-items:center; gap:6px;
  }
  /* Primary action — brand blue */
  .btn-amber{background:var(--primary); color:#fff; box-shadow:0 1px 2px rgba(24,63,129,.12);}
  .btn-amber:hover{background:var(--primary-hover); box-shadow:0 3px 8px rgba(24,63,129,.18); transform:translateY(-1px);}
  .btn-ghost{background:#fff; color:var(--primary); border:1px solid var(--primary-line);}
  .btn-ghost:hover{background:var(--primary-soft); border-color:#aebfd9;}
  .btn-danger{background:transparent; color:var(--red); border:1px solid #e8c4c1;}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:6px;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* Cards */
  .cards-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:28px;}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:relative; overflow:hidden;}
  .stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--slate);}
  .stat-card.c-amber::before{background:var(--amber);}
  .stat-card.c-red::before{background:var(--red);}
  .stat-card.c-green::before{background:var(--green);}
  .stat-card.c-teal::before{background:var(--teal);}
  .stat-num{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; line-height:1;}
  .stat-label{font-size:12px; color:var(--ink-dim); margin-top:6px; text-transform:uppercase; letter-spacing:0.4px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:24px;}
  .panel-header{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .panel-title{font-size:15px; font-weight:600; font-family:'Space Grotesk',sans-serif;}
  .panel-body{padding:4px 0;}
  .empty-state{padding:32px 20px; text-align:center; color:var(--ink-dim); font-size:13px;}

  /* Manifest-tag row */
  .tag-row{
    display:flex; align-items:center; gap:16px; padding:14px 20px 14px 24px; border-bottom:1px solid var(--line);
    position:relative;
  }
  .tag-row:last-child{border-bottom:none;}
  .tag-row::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:1px;
    background-image: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
  }
  .tag-row::after{
    content:''; position:absolute; left:-5px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-radius:50%; background:var(--bg); border:1px solid var(--line);
  }
  .tag-row.overdue{background:var(--red-bg);}
  .tag-row.handled{background:var(--green-bg);}
  .tag-main{flex:1; min-width:0;}
  .tag-name{font-weight:600; font-size:14px;}
  .tag-meta{font-size:12px; color:var(--ink-dim); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap;}
  .tag-meta span{white-space:nowrap;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap;
  }
  .badge-pending{background:var(--slate-bg); color:var(--slate);}
  .badge-overdue{background:var(--red-bg); color:var(--red); border:1px solid #eac2be;}
  .badge-delivered{background:var(--green-bg); color:var(--green);}
  .badge-due{background:#fdf1d9; color:var(--amber-ink);}
  .tag-actions{display:flex; gap:8px; flex-shrink:0;}

  /* Table */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:10px 20px; color:var(--ink-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; border-bottom:1px solid var(--line);}
  td{padding:12px 20px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.overdue-row{background:var(--red-bg);}

  /* Search bar */
  .search-bar-wrap{padding:14px 20px 6px 20px;}
  .search-bar{
    width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:8px; font-size:14px;
    font-family:'IBM Plex Sans',sans-serif; background:#fbfbfa;
  }
  .search-bar:focus{outline:2px solid rgba(24,63,129,.18); outline-offset:0; border-color:var(--primary);}

  /* Filter pills */
  .pill-group{display:flex; gap:6px;}
  .pill{
    padding:6px 13px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink-dim);
  }
  .pill.active{background:var(--primary); color:#fff; border-color:var(--primary);}

  /* Date nav */
  .date-nav{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 14px;}
  .date-nav button{background:none; border:none; cursor:pointer; font-size:15px; color:var(--ink-dim); padding:2px 8px;}
  .date-nav button:hover{color:var(--ink);}
  .date-nav .cur-date{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; min-width:210px; text-align:center;}

  /* Modal */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(20,24,30,0.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  #modal-overlay.open{display:flex;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-header{padding:20px 24px 12px 24px; display:flex; justify-content:space-between; align-items:center;}
  .modal-header h3{font-size:17px;}
  .modal-close{cursor:pointer; font-size:20px; color:var(--ink-dim); line-height:1;}
  .modal-body{padding:4px 24px 24px 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.3px;}
  .field input, .field select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:'IBM Plex Sans',sans-serif; background:#fbfbfa;
  }
  .field input:focus, .field select:focus{outline:2px solid rgba(24,63,129,.18); outline-offset:0; border-color:var(--primary);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .hint{font-size:11px; color:var(--ink-dim); margin-top:4px;}

  /* Warehouse */
  .warehouse-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .warehouse-toolbar-copy{display:flex; flex-direction:column; gap:3px;}
  .warehouse-kicker{
    display:inline-flex; align-items:center; gap:7px; width:max-content;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;
    color:var(--primary); background:var(--primary-soft); border:1px solid var(--primary-line);
    border-radius:999px; padding:4px 9px;
  }
  .warehouse-kicker::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--primary);}
  .warehouse-week-nav{
    display:flex; align-items:center; gap:4px; background:#fff;
    border:1px solid var(--primary-line); border-radius:10px; padding:4px;
    box-shadow:0 2px 8px rgba(27,36,48,.04);
  }
  .warehouse-week-nav button{
    width:34px; height:34px; border:0; border-radius:7px; background:transparent;
    cursor:pointer; color:var(--primary); font-size:20px; line-height:1;
  }
  .warehouse-week-nav button:hover{background:var(--primary-soft);}
  .warehouse-week-label{
    min-width:205px; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:600; color:var(--ink);
  }
  .warehouse-summary{grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:22px;}
  .warehouse-summary .stat-card{
    padding:16px 18px; border-color:#d8e0eb; box-shadow:0 2px 10px rgba(27,36,48,.035);
  }
  .warehouse-summary .stat-card::before{width:0;}
  .warehouse-summary .stat-card.primary-stat{background:linear-gradient(135deg,#183F81 0%,#24549a 100%); color:#fff; border-color:#183F81;}
  .warehouse-summary .primary-stat .stat-label{color:rgba(255,255,255,.72);}
  .warehouse-summary .primary-stat .stat-num{color:#fff;}
  .warehouse-summary .stat-card:not(.primary-stat)::after{
    content:''; position:absolute; top:16px; right:16px; width:7px; height:7px;
    border-radius:50%; background:var(--primary-line);
  }
  .week-grid{
    display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px;
    margin-bottom:24px; align-items:stretch; overflow-x:auto; padding-bottom:4px;
  }
  .today-tabs{display:flex;gap:6px;background:#eef2f7;border:1px solid #d8e0eb;border-radius:12px;padding:5px;margin-bottom:16px;max-width:520px;}
  .today-tab{flex:1;border:0;background:transparent;border-radius:9px;padding:11px 16px;cursor:pointer;color:var(--ink-dim);font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s ease;}
  .today-tab span{font-size:13px;}
  .today-tab small{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;opacity:.75;}
  .today-tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 7px rgba(27,36,48,.09);}
  .today-tab:hover:not(.active){background:rgba(255,255,255,.55);}
  .week-day-col{
    background:#fff; border:1px solid #d8e0eb; border-radius:12px; min-height:250px;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 2px 8px rgba(27,36,48,.035);
  }
  .week-day-col.today-col{border-color:var(--primary); box-shadow:0 0 0 1px rgba(24,63,129,.08),0 4px 14px rgba(24,63,129,.08);}
  .week-day-header{
    padding:12px 12px 11px; border-bottom:1px solid #e2e7ef; display:flex;
    align-items:center; justify-content:space-between; gap:8px; background:#f8fafc;
  }
  .week-day-header.today{background:var(--primary); color:#fff; border-bottom-color:var(--primary);}
  .week-day-header.today .week-day-date{color:rgba(255,255,255,.72);}
  .week-day-name{font-weight:700; font-size:12px; font-family:'Space Grotesk',sans-serif; text-transform:uppercase; letter-spacing:.35px;}
  .week-day-date{display:block; font-weight:500; font-size:11px; color:var(--ink-dim); margin-top:3px;}
  .week-day-header .day-count{background:#e9eef5; color:var(--primary); border:1px solid #d4deeb; font-size:10px; font-family:'IBM Plex Mono',monospace; padding:3px 7px; border-radius:999px; font-weight:700;}
  .week-day-header.today .day-count{background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.2);}
  .week-day-body{padding:9px; display:flex; flex-direction:column; gap:8px; flex:1; background:#fcfdff;}
  .week-order-card{
    background:#fff; border:1px solid #dce3ed; border-left:3px solid var(--primary);
    border-radius:9px; padding:10px; font-size:12px; box-shadow:0 1px 4px rgba(27,36,48,.04);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .week-order-card:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(27,36,48,.08);}
  .week-order-card.overdue{background:var(--red-bg); border-color:#eac2be; border-left-color:var(--red);}
  .week-order-card.delivered{background:var(--green-bg); border-color:#bfe0c9; border-left-color:var(--green); opacity:.92;}
  .week-order-name{font-weight:700; font-size:12.5px; color:var(--ink); line-height:1.3;}
  .week-order-meta{color:var(--ink-dim); font-size:10.5px; margin-top:4px; line-height:1.35;}
  .week-order-foot{margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;}
  .week-empty{
    min-height:180px; display:flex; align-items:center; justify-content:center;
    padding:16px 8px; font-size:11.5px; color:#8993a2; text-align:center;
  }
  @media (max-width:1100px){
    .warehouse-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
    .week-grid{grid-template-columns:repeat(7,minmax(155px,1fr));}
  }

  ::selection{background:#fdeecb;}
  @media (max-width:900px){
    .week-grid{grid-template-columns:repeat(4, minmax(160px,1fr)); overflow-x:auto;}
  }
  @media (max-width:760px){
    #app{flex-direction:column;}
    #sidebar{width:100%; height:auto; flex-direction:row; overflow-x:auto; padding:12px;}
    .brand{display:none;}
    .sidebar-footer{display:none;}
    .nav-item{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .nav-item.active{border-bottom-color:var(--amber);}
    #main{padding:20px;}
    .week-grid{grid-template-columns:1fr; overflow-x:visible;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="brand-mark">Ajaltoun</div>
      <div class="brand-sub">Vendor Order Tracker</div>
    </div>
    <div class="nav-item" data-tab="dashboard"><span class="nav-icon">▤</span> Dashboard</div>
    <div class="nav-item" data-tab="today"><span class="nav-icon">◷</span> Today's Run</div>
    <div class="nav-item" data-tab="warehouse"><span class="nav-icon">▥</span> Warehouse</div>
    <div class="nav-item" data-tab="rentals"><span class="nav-icon">▧</span> Rentals</div>
    <div class="nav-item" data-tab="vendors"><span class="nav-icon">☰</span> Vendors</div>
    <div class="sidebar-footer">
      <div id="storage-status" style="margin-bottom:10px;"></div>
      <button class="btn btn-ghost btn-sm" id="backup-excel-btn" style="width:100%; justify-content:center; color:#183F81; border-color:rgba(255,255,255,0.25);">⇩ Backup to Excel</button>
      <button class="btn btn-ghost btn-sm" id="sync-now-btn" style="width:100%; justify-content:center; color:#183F81; border-color:rgba(255,255,255,0.25); margin-top:8px;">⟳ Sync now</button>

      <div style="margin-top:10px;"><span class="reset-link" id="reset-data">Reset all data</span></div>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<script>
/* ---------------- State & storage ---------------- */
let vendors = [];
let orders = [];
let skips = [];
let rentals = [];
let storageOK = true;
let storageMode = 'none'; // 'supabase' | 'claude' | 'local' | 'none'
const LOCAL_KEY = 'vendor-tracker-app-data';

/* Supabase config — public URL + publishable key, safe to expose in client code.
   Data access is controlled by the Row Level Security policies set on the app_data table. */
const SUPABASE_URL = 'https://uupeppqxylbfbzgafddt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_k3X5kDt64z7W9Ny69TcbFA_35OXi5w3';
const SUPABASE_ROW_ID = 'shared';
const SUPABASE_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const SUPABASE_HEADERS = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

async function supabaseGetPayload(){
  const url = `${SUPABASE_URL}/rest/v1/app_data?id=eq.${SUPABASE_ROW_ID}&select=payload`;
  const res = await fetch(url, { headers: SUPABASE_HEADERS });
  if(!res.ok) throw new Error('Supabase read failed: '+res.status);
  const rows = await res.json();
  return (rows && rows.length) ? rows[0].payload : null;
}

async function supabaseSetPayload(dataObj){
  const url = `${SUPABASE_URL}/rest/v1/app_data?id=eq.${SUPABASE_ROW_ID}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { ...SUPABASE_HEADERS, Prefer: 'return=minimal' },
    body: JSON.stringify({ payload: dataObj, updated_at: new Date().toISOString() })
  });
  if(!res.ok) throw new Error('Supabase write failed: '+res.status);
}

async function storageGetData(){
  if(SUPABASE_ENABLED){
    try{
      const payload = await supabaseGetPayload();
      storageMode = 'supabase';
      return payload;
    }catch(e){
      console.error('Supabase read failed, falling back', e);
      // fall through
    }
  }
  if(window.storage){
    try{
      const res = await window.storage.get('app-data', false);
      storageMode = 'claude';
      return res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      // fall through to local storage
    }
  }
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    storageMode = 'local';
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    storageMode = 'none';
    return null;
  }
}

async function storageSetData(dataObj){
  const json = JSON.stringify(dataObj);
  let savedRemote = false;
  if(SUPABASE_ENABLED){
    try{
      await supabaseSetPayload(dataObj);
      savedRemote = true;
      storageMode = 'supabase';
    }catch(e){
      console.error('Supabase write failed, falling back', e);
    }
  }
  if(!savedRemote && window.storage){
    try{
      await window.storage.set('app-data', json, false);
      savedRemote = true;
      storageMode = 'claude';
    }catch(e){ /* fall through */ }
  }
  // Always mirror to localStorage too, so a reload while offline (or a
  // failed remote save) still keeps the data.
  try{
    localStorage.setItem(LOCAL_KEY, json);
    if(!savedRemote) storageMode = 'local';
  }catch(e){
    if(!savedRemote){ storageMode = 'none'; console.error('No storage available', e); }
  }
}
let state = { tab:'dashboard', todayViewDate: toDateStr(new Date()), todaySubtab:'orders', orderFilter:'all', vendorSearch:'', vendorDayFilter:'all', todaySearch:'', otherVendorsShown:25 };

async function loadData(){
  try{
    const parsed = await storageGetData();
    if(parsed){
      vendors = parsed.vendors || [];
      orders = parsed.orders || [];
      skips = parsed.skips || [];
      rentals = parsed.rentals || [];
    }
    if(storageMode==='supabase') state.lastSyncCheckAt = new Date();
  }catch(e){
    storageOK = false;
  }
  updateStorageStatusUI();
  render();
}

async function saveData(){
  try{
    await storageSetData({vendors, orders, skips, rentals});
    state.lastSavedAt = new Date();
  }catch(e){
    console.error('Storage save failed', e);
  }
  updateStorageStatusUI();
}

function updateStorageStatusUI(){
  const el = document.getElementById('storage-status');
  if(!el) return;
  const time = state.lastSavedAt ? state.lastSavedAt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : null;
  let dot = '#6b7280', modeText = 'Not saved yet';
  if(storageMode==='supabase'){ dot='#3fa34d'; modeText = 'Synced to shared cloud database — updates automatically for everyone using this link.'; }
  else if(storageMode==='claude'){ dot='#3fa34d'; modeText = 'Synced to your Claude account — stays put across browsers & devices while signed in.'; }
  else if(storageMode==='local'){ dot='#d98e04'; modeText = 'Saved in this browser only. Use "Backup to Excel" regularly, or switch browsers/devices and it will not follow.'; }
  else { dot='#c1443c'; modeText = 'No storage available right now — back up to Excel to avoid losing data.'; }
  let checkedText = '';
  if(SUPABASE_ENABLED && state.lastSyncCheckAt){
    const secsAgo = Math.max(0, Math.round((Date.now()-state.lastSyncCheckAt.getTime())/1000));
    const label = secsAgo < 5 ? 'just now' : (secsAgo < 60 ? `${secsAgo}s ago` : `${Math.round(secsAgo/60)}m ago`);
    checkedText = `<div style="font-size:10px; color:var(--sidebar-ink); opacity:0.55; margin-top:2px;">Checked for updates ${label}</div>`;
  }
  el.innerHTML = `
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:#fff;">
      <span style="width:7px; height:7px; border-radius:50%; background:${dot}; display:inline-block;"></span>
      ${time ? 'Saved '+time : 'Not saved yet'}
    </div>
    <div style="font-size:10.5px; color:var(--sidebar-ink); opacity:0.7; margin-top:3px; line-height:1.4;">${modeText}</div>
    ${checkedText}
  `;
}

/* ---------------- Date helpers ---------------- */
function toDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()+n);
  return toDateStr(d);
}
function todayStr(){ return toDateStr(new Date()); }
function dayName(idx, short){
  const full=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const shortN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return short ? shortN[idx] : full[idx];
}
function formatDateNice(dateStr){
  const d = parseDate(dateStr);
  return dayName(d.getDay(),true)+', '+d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
}
function nextOccurrence(dayOfWeek, fromDateStr){
  const d = parseDate(fromDateStr || todayStr());
  const diff = (dayOfWeek - d.getDay() + 7) % 7;
  d.setDate(d.getDate()+diff);
  return toDateStr(d);
}
function startOfWeek(dateStr){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()-d.getDay());
  return toDateStr(d);
}
const FREQ_LABELS = {1:'Every week', 2:'Every 2 weeks', 3:'Every 3 weeks', 4:'Every 4 weeks (monthly)'};

/* ---------------- Domain logic ---------------- */
function isDueOn(vendor, dateStr){
  const date = parseDate(dateStr);
  if(date.getDay() !== Number(vendor.dayOfWeek)) return false;
  const anchor = parseDate(vendor.anchorDate);
  const diffDays = Math.round((date - anchor)/86400000);
  if(diffDays < 0) return false;
  const diffWeeks = Math.round(diffDays/7);
  return diffWeeks % Number(vendor.frequencyWeeks) === 0;
}
function ordersForVendor(vendorId){
  return orders.filter(o=>o.vendorId===vendorId).sort((a,b)=> a.orderDate < b.orderDate ? 1 : -1);
}
function lastOrderDate(vendorId){
  const list = ordersForVendor(vendorId);
  return list.length ? list[0].orderDate : null;
}
function lastDelivery(vendorId){
  const delivered = orders.filter(o=>o.vendorId===vendorId && o.status==='delivered').sort((a,b)=> a.deliveredDate < b.deliveredDate ? 1 : -1);
  return delivered.length ? delivered[0] : null;
}
function isOverdue(order){
  return order.status==='pending' && order.expectedDelivery < todayStr();
}
function pendingOrderForVendor(vendorId){
  const list = orders.filter(o=>o.vendorId===vendorId && o.status==='pending').sort((a,b)=> a.orderDate < b.orderDate ? 1 : -1);
  return list.length ? list[0] : null;
}
function orderStatusBadge(order){
  if(order.status==='delivered') return '<span class="badge badge-delivered">Delivered</span>';
  if(isOverdue(order)) return '<span class="badge badge-overdue">Overdue</span>';
  return '<span class="badge badge-pending">Pending</span>';
}
function hasOrderOnDate(vendorId, dateStr){
  return orders.some(o=>o.vendorId===vendorId && o.orderDate===dateStr);
}
function vendorById(id){ return vendors.find(v=>v.id===id); }
function hasSkipOnDate(vendorId, dateStr){
  return skips.some(s=>s.vendorId===vendorId && s.date===dateStr);
}
function skipsForVendor(vendorId){
  return skips.filter(s=>s.vendorId===vendorId).sort((a,b)=> a.date < b.date ? 1 : -1);
}
function lastSkip(vendorId){
  const list = skipsForVendor(vendorId);
  return list.length ? list[0] : null;
}
function addSkip(vendorId, dateStr){
  skips.push({ id:'s_'+Date.now()+Math.random().toString(36).slice(2,7), vendorId, date:dateStr, loggedAt:new Date().toISOString() });
  saveData();
}
function removeSkip(vendorId, dateStr){
  skips = skips.filter(s=>!(s.vendorId===vendorId && s.date===dateStr));
  saveData();
}
function matchesSearch(v, term){
  if(!term) return true;
  const t = term.toLowerCase();
  return (v.name||'').toLowerCase().includes(t) || (v.salesmanName||'').toLowerCase().includes(t) || (v.phone||'').toLowerCase().includes(t);
}

function updateOverdueBadge(){
  const count = orders.filter(isOverdue).length;
  const el = document.getElementById('nav-overdue-badge');
  if(!el) return;
  if(count>0){ el.style.display='inline-block'; el.textContent=count; }
  else{ el.style.display='none'; }
}

/* ---------------- Rendering ---------------- */
function render(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===state.tab));
  updateOverdueBadge();
  const main = document.getElementById('main');
  if(state.tab==='dashboard') main.innerHTML = renderDashboard();
  else if(state.tab==='today') main.innerHTML = renderToday();
  else if(state.tab==='warehouse') main.innerHTML = renderWarehouse();
  else if(state.tab==='vendors') main.innerHTML = renderVendors();
  else if(state.tab==='rentals') main.innerHTML = renderRentals();
  attachMainEvents();
}

      <div class="stat-card"><div class="stat-num">${ordersToday.length}</div><div class="stat-label">Orders placed today</div></div>

      </div>
      <div class="panel-body">
        ${dueTodayVendors.length ? dueTodayVendors.map(v=>{

          const skipped = hasSkipOnDate(v.id, today);

          else if(skipped) badge = '<span class="badge badge-pending">No order</span>';

function renderToday(){
  const d = state.todayViewDate;
  const isToday = d===todayStr();
  const activeSubtab = state.todaySubtab || 'orders';

  function isVendorHandled(v){
    const pendingOrder = pendingOrderForVendor(v.id);
    return !!pendingOrder || hasSkipOnDate(v.id, d);
  }

  const dueVendorsAll = vendors.filter(v=>isDueOn(v,d));
  const otherVendorsAll = vendors.filter(v=>!isDueOn(v,d));
  const dueNeedOrder = dueVendorsAll.filter(v=>!isVendorHandled(v));
  const otherNeedOrder = otherVendorsAll.filter(v=>!isVendorHandled(v));

  const awaitingDelivery = vendors
    .filter(v=>!!pendingOrderForVendor(v.id))
    .sort((a,b)=>{
      const oa = pendingOrderForVendor(a.id), ob = pendingOrderForVendor(b.id);
      return oa.expectedDelivery < ob.expectedDelivery ? -1 : (oa.expectedDelivery > ob.expectedDelivery ? 1 : 0);
    });
  const overdueCount = awaitingDelivery.filter(v=>isOverdue(pendingOrderForVendor(v.id))).length;
  const skippedForDate = vendors.filter(v=>!pendingOrderForVendor(v.id) && hasSkipOnDate(v.id, d));

  function vendorRow(v, scheduled){
    const pendingOrder = pendingOrderForVendor(v.id);
    const skipped = hasSkipOnDate(v.id, d);
    const lastOrd = lastOrderDate(v.id);
    const lastDel = lastDelivery(v.id);
    const searchKey = ((v.name||'')+' '+(v.salesmanName||'')+' '+(v.phone||'')).toLowerCase();
    const handled = !!pendingOrder || skipped;
    let actions;

    if(activeSubtab==='receiving'){
      if(pendingOrder){
        const overdue = isOverdue(pendingOrder);
        actions = `<span class="badge ${overdue?'badge-overdue':'badge-pending'}">${overdue?'Overdue':'Awaiting'} · exp ${pendingOrder.expectedDelivery}</span>
          <button class="btn btn-amber btn-sm" data-action="deliver" data-id="${pendingOrder.id}">✓ Mark Received</button>`;
      } else {
        actions = `<span class="badge badge-delivered">No pending delivery</span>`;
      }
    } else {
      if(pendingOrder){
        const overdue = isOverdue(pendingOrder);
        actions = `<span class="badge ${overdue?'badge-overdue':'badge-pending'}">${overdue?'Overdue':'Ordered'} · exp ${pendingOrder.expectedDelivery}</span>
          <button class="btn btn-ghost btn-sm" data-action="deliver" data-id="${pendingOrder.id}">Mark Received</button>`;
      } else if(skipped){
        actions = `<span class="badge badge-pending">No order</span><button class="btn btn-ghost btn-sm" data-action="undo-skip" data-id="${v.id}" data-date="${d}">Undo</button>`;
      } else {
        actions = `<button class="btn ${scheduled?'btn-amber':'btn-ghost'} btn-sm" data-action="place-order" data-id="${v.id}">Place Order</button>
          <button class="btn btn-ghost btn-sm" data-action="no-order" data-id="${v.id}" data-date="${d}">No Order</button>`;
      }
    }

    return `<div class="tag-row ${handled?'handled':''} ${pendingOrder && isOverdue(pendingOrder)?'overdue':''}" data-search="${escapeHtml(searchKey)}">
      <div class="tag-main">
        <div class="tag-name">${escapeHtml(v.name)} ${scheduled?'<span class="badge badge-due">Scheduled</span>':''}</div>
        <div class="tag-meta">
          <span>${escapeHtml(v.salesmanName||'—')}</span>
          <span class="mono">${escapeHtml(v.phone||'—')}</span>
          <span>Lead time: ${v.leadTimeDays}d</span>
          <span>Last order: ${lastOrd || '—'}</span>
          <span>Last delivery: ${lastDel ? (lastDel.deliveredDate + (lastDel.deliveredTime? ' '+lastDel.deliveredTime:'')) : '—'}</span>
        </div>
      </div>
      <div class="tag-actions">${actions}</div>
    </div>`;
  }

  const ordersContent = `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Scheduled orders</div>
        <span class="badge badge-due">${dueNeedOrder.length} to order</span>
      </div>
      <div class="panel-body">
        <div id="today-scheduled-list">
          ${dueNeedOrder.length ? dueNeedOrder.map(v=>vendorRow(v,true)).join('') : '<div class="empty-state">No vendor is waiting on an order for this date.</div>'}
        </div>
        <div class="empty-state" id="today-scheduled-no-match" style="display:none;">No vendors match your search.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><div class="panel-title">Other vendors — order early or out of turn</div></div>
      <div class="panel-body">
        <div id="today-other-list">
          ${otherNeedOrder.length ? otherNeedOrder.map(v=>vendorRow(v,false)).join('') : '<div class="empty-state">No other vendors waiting — add some in the Vendors tab.</div>'}
        </div>
        <div class="empty-state" id="today-no-match" style="display:none;">No vendors match your search.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><div class="panel-title">No order logged — ${formatDateNice(d)}</div></div>
      <div class="panel-body">
        <div id="today-skipped-list">
          ${skippedForDate.length ? skippedForDate.map(v=>vendorRow(v,isDueOn(v,d))).join('') : '<div class="empty-state">Nothing logged as "no order" for this date.</div>'}
        </div>
        <div class="empty-state" id="today-skipped-no-match" style="display:none;">No vendors match your search.</div>
      </div>
    </div>`;

  const receivingContent = `
    <div class="cards-row" style="margin-bottom:16px;">
      <div class="stat-card primary-stat"><div class="stat-num">${awaitingDelivery.length}</div><div class="stat-label">Awaiting receipt</div></div>
      <div class="stat-card c-red"><div class="stat-num">${overdueCount}</div><div class="stat-label">Overdue</div></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Incoming orders ${overdueCount ? `<span class="badge badge-overdue" style="margin-left:6px;">${overdueCount} overdue</span>` : ''}</div>
      </div>
      <div class="panel-body">
        <div id="today-awaiting-list">
          ${awaitingDelivery.length ? awaitingDelivery.map(v=>vendorRow(v,isDueOn(v,d))).join('') : '<div class="empty-state">Everything is received. No incoming orders right now.</div>'}
        </div>
        <div class="empty-state" id="today-awaiting-no-match" style="display:none;">No vendors match your search.</div>
      </div>
    </div>`;

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Today's Run</div>
        <div class="page-sub">Place orders and receive deliveries from the same workspace.</div>
      </div>
      <div class="date-nav">
        <button data-action="date-prev">‹</button>
        <span class="cur-date">${formatDateNice(d)}${isToday?' · Today':''}</span>
        <button data-action="date-next">›</button>
        ${!isToday?'<button class="btn btn-ghost btn-sm" data-action="date-today" style="margin-left:6px;">Today</button>':''}
      </div>
    </div>

    <div class="today-tabs" role="tablist">
      <button class="today-tab ${activeSubtab==='orders'?'active':''}" data-action="today-tab" data-subtab="orders">
        <span>Orders</span><small>${dueNeedOrder.length} ready</small>
      </button>
      <button class="today-tab ${activeSubtab==='receiving'?'active':''}" data-action="today-tab" data-subtab="receiving">
        <span>Receiving</span><small>${awaitingDelivery.length}${overdueCount?' · '+overdueCount+' overdue':''}</small>
      </button>
    </div>

    <div class="search-bar-wrap" style="padding:0 0 16px 0;">
      <input type="text" class="search-bar" id="today-search-input" placeholder="Search vendors or salesmen…" value="${escapeHtml(state.todaySearch||'')}">
    </div>

    ${activeSubtab==='orders' ? ordersContent : receivingContent}
  `;
}

function renderWarehouse(){
  if(!state.warehouseWeekStart) state.warehouseWeekStart = startOfWeek(todayStr());
  const weekStart = state.warehouseWeekStart;
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(weekStart, i));
  const todayS = todayStr();
  const isCurrentWeek = weekStart === startOfWeek(todayS);

  function ordersForDay(dayStr){
    return orders.filter(o=>o.expectedDelivery===dayStr).sort((a,b)=>{
      const va = vendorById(a.vendorId), vb = vendorById(b.vendorId);
      return (va?va.name:'').localeCompare(vb?vb.name:'');
    });
  }

  const weekOrders = orders.filter(o=>days.includes(o.expectedDelivery));
  const totalExpected = weekOrders.length;
  const deliveredCount = weekOrders.filter(o=>o.status==='delivered').length;
  const overdueCount = weekOrders.filter(isOverdue).length;
  const pendingCount = weekOrders.filter(o=>o.status==='pending' && !isOverdue(o)).length;

  function orderCard(o){
    const v = vendorById(o.vendorId);
    const overdue = isOverdue(o);
    const cardCls = o.status==='delivered' ? 'delivered' : (overdue ? 'overdue' : '');
    const badge = o.status==='delivered'
      ? '<span class="badge badge-delivered">Delivered</span>'
      : (overdue ? '<span class="badge badge-overdue">Overdue</span>' : '<span class="badge badge-pending">Pending</span>');

    return `<div class="week-order-card ${cardCls}">
      <div class="week-order-name">${escapeHtml(v?v.name:'Unknown vendor')}</div>
      <div class="week-order-meta">${escapeHtml(v&&v.salesmanName?v.salesmanName:'—')}${v&&v.phone?' · '+escapeHtml(v.phone):''}</div>
      <div class="week-order-meta">Ordered ${o.orderDate} · ${o.leadTimeDays}d lead</div>
      <div class="week-order-foot">
        ${badge}
        ${o.status==='pending' ? `<button class="btn btn-amber btn-sm" data-action="deliver" data-id="${o.id}">✓ Receive</button>` : ''}
      </div>
    </div>`;
  }

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Warehouse</div>
        <div class="page-sub">A clear weekly view of everything expected to arrive.</div>
      </div>
    </div>

    <div class="warehouse-toolbar">
      <div class="warehouse-toolbar-copy">
        <span class="warehouse-kicker">Delivery schedule</span>
        <div class="hint">Track incoming orders by expected delivery date.</div>
      </div>
      <div class="warehouse-week-nav">
        <button data-action="week-prev" aria-label="Previous week">‹</button>
        <span class="warehouse-week-label">${formatDateNice(weekStart)} – ${formatDateNice(addDays(weekStart,6))}</span>
        <button data-action="week-next" aria-label="Next week">›</button>
        ${!isCurrentWeek?'<button class="btn btn-ghost btn-sm" data-action="week-today" style="margin-left:4px;">This week</button>':''}
      </div>
    </div>

    <div class="cards-row warehouse-summary">
      <div class="stat-card primary-stat">
        <div class="stat-num">${totalExpected}</div>
        <div class="stat-label">Expected this week</div>
      </div>
      <div class="stat-card c-green">
        <div class="stat-num">${deliveredCount}</div>
        <div class="stat-label">Received</div>
      </div>
      <div class="stat-card c-amber">
        <div class="stat-num">${pendingCount}</div>
        <div class="stat-label">Still pending</div>
      </div>
      <div class="stat-card c-red">
        <div class="stat-num">${overdueCount}</div>
        <div class="stat-label">Overdue</div>
      </div>
    </div>

    <div class="week-grid">
      ${days.map(dayStr=>{
        const dayOrders = ordersForDay(dayStr);
        const isTodayCol = dayStr===todayS;
        const dObj = parseDate(dayStr);
        return `<div class="week-day-col ${isTodayCol?'today-col':''}">
          <div class="week-day-header ${isTodayCol?'today':''}">
            <div>
              <span class="week-day-name">${dayName(dObj.getDay(),true)}</span>
              <span class="week-day-date">${dObj.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
            </div>
            ${dayOrders.length ? `<span class="day-count">${dayOrders.length}</span>` : ''}
          </div>
          <div class="week-day-body">
            ${dayOrders.length ? dayOrders.map(orderCard).join('') : '<div class="week-empty">No deliveries<br>scheduled</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function filterRowsBySearch(containerSelector, term, emptyStateSelector){
  const container = document.querySelector(containerSelector);
  if(!container) return;
  const t = (term||'').trim().toLowerCase();
  const rows = container.querySelectorAll('.tag-row');
  let visibleCount = 0;
  rows.forEach(row=>{
    const key = row.dataset.search || '';
    const match = !t || key.includes(t);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyEl = document.querySelector(emptyStateSelector);
  if(emptyEl) emptyEl.style.display = (t && visibleCount===0) ? 'block' : 'none';
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Excel import ---------------- */
const DAY_MAP = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
function parseDayOfWeek(val){
  if(val===undefined||val===null||String(val).trim()==='') return null;
  const s = String(val).trim().toLowerCase();
  if(DAY_MAP.hasOwnProperty(s)) return DAY_MAP[s];
  const n = Number(s);
  if(!isNaN(n) && n>=0 && n<=6) return n;
  return null;
}
function parseFrequency(val){
  if(val===undefined||val===null||String(val).trim()==='') return 1;
  const s = String(val).trim().toLowerCase();
  const n = parseInt(s,10);
  if(s.includes('month')) return 4;
  if(s.includes('bi')) return 2;
  if(!isNaN(n) && n>=1 && n<=4) return n;
  return 1;
}
function findHeaderKey(headers, candidates){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  for(const c of candidates){
    const idx = lower.indexOf(c);
    if(idx>-1) return headers[idx];
  }
  for(let i=0;i<lower.length;i++){
    for(const c of candidates){
      if(lower[i].includes(c)) return headers[i];
    }
  }
  return null;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){
        alert('No rows found in that file.');
        return;
      }
      const headers = Object.keys(rows[0]);
      const nameKey = findHeaderKey(headers, ['name','vendor','vendor name','supplier','supplier name']);
      const salesKey = findHeaderKey(headers, ['salesman','salesman name','rep','sales rep','contact']);
      const phoneKey = findHeaderKey(headers, ['phone','phone number','contact number','tel','mobile']);
      const dayKey = findHeaderKey(headers, ['day','day of week','passes on','delivery day','routing day']);
      const freqKey = findHeaderKey(headers, ['frequency','routing','interval','weeks']);
      const leadKey = findHeaderKey(headers, ['lead time','lead time days','leadtime','lead']);
      const anchorKey = findHeaderKey(headers, ['anchor date','start date','first date','anchor']);

      const parsed = [];
      const skippedRows = [];
      rows.forEach((row, i)=>{
        const name = nameKey ? String(row[nameKey]).trim() : '';
        if(!name){ skippedRows.push(`Row ${i+2}: missing vendor name`); return; }
        const dayRaw = dayKey ? row[dayKey] : '';
        const dayOfWeek = parseDayOfWeek(dayRaw);
        if(dayOfWeek===null){ skippedRows.push(`Row ${i+2} (${name}): missing or unrecognized day of week`); return; }
        const frequencyWeeks = parseFrequency(freqKey ? row[freqKey] : '');
        const leadTimeDays = leadKey && row[leadKey]!=='' && !isNaN(Number(row[leadKey])) ? Number(row[leadKey]) : 4;
        let anchorDate = anchorKey ? String(row[anchorKey]).trim() : '';
        if(!anchorDate || isNaN(Date.parse(anchorDate))){
          anchorDate = nextOccurrence(dayOfWeek);
        } else {
          const d = new Date(anchorDate);
          anchorDate = toDateStr(d);
        }
        parsed.push({
          id: 'v_'+Date.now()+Math.random().toString(36).slice(2,7)+i,
          name,
          salesmanName: salesKey ? String(row[salesKey]).trim() : '',
          phone: phoneKey ? String(row[phoneKey]).trim() : '',
          dayOfWeek,
          frequencyWeeks,
          leadTimeDays,
          anchorDate
        });
      });
      importPreviewModal(parsed, skippedRows, !nameKey, !dayKey);
    }catch(err){
      console.error(err);
      alert('Could not read that file. Make sure it is a valid .xlsx, .xls, or .csv file.');
    }finally{
      e.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

function buildBackupWorkbook(){
  const wb = XLSX.utils.book_new();
  const vSheet = XLSX.utils.json_to_sheet(vendors.map(v=>({
    Name:v.name, Salesman:v.salesmanName, Phone:v.phone, Day:dayName(Number(v.dayOfWeek)),
    Frequency:FREQ_LABELS[v.frequencyWeeks], 'Lead Time (days)':v.leadTimeDays, 'Anchor Date':v.anchorDate
  })));
  const oSheet = XLSX.utils.json_to_sheet(orders.map(o=>{
    const v = vendorById(o.vendorId);
    return {
      Vendor: v?v.name:'Unknown', 'Order Date':o.orderDate, 'Lead Time (days)':o.leadTimeDays,
      'Expected Delivery':o.expectedDelivery, Status: o.status==='delivered'?'Delivered':(isOverdue(o)?'Overdue':'Pending'),
      'Delivered Date':o.deliveredDate||'', 'Delivered Time':o.deliveredTime||''
    };
  }));
  const sSheet = XLSX.utils.json_to_sheet(skips.map(s=>{
    const v = vendorById(s.vendorId);
    return { Vendor: v?v.name:'Unknown', 'No-Order Date': s.date };
  }));
  const rentalsThisYear = new Date().getFullYear();
  const rentalsLastYear = rentalsThisYear - 1;
  const rSheet = XLSX.utils.json_to_sheet(rentals.map(r=>{
    const v = vendorById(r.vendorId);
    const ly = rentalYearTotal(r, rentalsLastYear), ty = rentalYearTotal(r, rentalsThisYear);
    const pct = ly>0 ? Math.round(((ty-ly)/ly)*100) : (ty>0?100:0);
    const lyVals = (r.monthly && Array.isArray(r.monthly[rentalsLastYear])) ? r.monthly[rentalsLastYear] : Array(12).fill(0);
    const tyVals = (r.monthly && Array.isArray(r.monthly[rentalsThisYear])) ? r.monthly[rentalsThisYear] : Array(12).fill(0);
    const row = { Gondola:r.gondola, Supplier: v?v.name:'Unknown', 'Date From':r.dateFrom||'', 'Date To':r.dateTo||'' };
    MONTH_NAMES.forEach((m,i)=>{ row[`${m} ${rentalsLastYear}`] = Number(lyVals[i])||0; });
    MONTH_NAMES.forEach((m,i)=>{ row[`${m} ${rentalsThisYear}`] = Number(tyVals[i])||0; });
    row[`${rentalsLastYear} Total`] = ly;
    row[`${rentalsThisYear} Total`] = ty;
    row['Change %'] = pct;
    row['Signal'] = pct>=0?'Recommend renewal':'Review before renewal';
    return row;
  }));
  XLSX.utils.book_append_sheet(wb, vSheet, 'Vendors');
  XLSX.utils.book_append_sheet(wb, oSheet, 'Orders');
  XLSX.utils.book_append_sheet(wb, sSheet, 'No-Order Weeks');
  XLSX.utils.book_append_sheet(wb, rSheet, 'Rentals');
  return wb;
}

function exportBackup(){
  const wb = buildBackupWorkbook();
  const now = new Date();
  const stamp = toDateStr(now)+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb, `vendor-tracker-backup-${stamp}.xlsx`);
}

function attemptPlaceOrder(vendorId){
  const v = vendorById(vendorId);
  const pending = orders.filter(o=>o.vendorId===vendorId && o.status==='pending');
  if(pending.length){
    const rows = pending.map(o=>`Ordered ${o.orderDate} → expected ${o.expectedDelivery}${isOverdue(o)?' <strong style="color:var(--red)">(overdue)</strong>':''}`).join('<br>');
    confirmModal(
      'Order not yet received',
      `<p style="margin-top:0;">${escapeHtml(v?v.name:'This vendor')} already has ${pending.length} order${pending.length>1?'s':''} that ${pending.length>1?'haven\u2019t':'hasn\u2019t'} been marked as delivered:</p>

       <p>Place another order anyway?</p>`,

  } else {
    placeOrderModal(vendorId);
  }
}

        <div class="field-row">
          <div class="field"><label>Delivery date</label><input type="date" name="deliveredDate" value="${todayStr()}"></div>
          <div class="field"><label>Delivery time</label><input type="time" name="deliveredTime" value="${nowTime}"></div>
        </div>
        <div class="hint" id="deliver-form-error" style="color:var(--red); display:none;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-amber" id="deliver-form-submit">Confirm delivered</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('deliver-form-submit').addEventListener('click', ()=>{
    const root = document.getElementById('deliver-form');
    const deliveredDate = root.querySelector('[name="deliveredDate"]').value;
    const errEl = document.getElementById('deliver-form-error');
    if(!deliveredDate){
      errEl.textContent = 'Please pick a delivery date.';
      errEl.style.display = 'block';
      return;
    }
    o.status='delivered';
    o.deliveredDate = deliveredDate;
    o.deliveredTime = root.querySelector('[name="deliveredTime"]').value;
    saveData();
    closeModal();
    render();
  });
}

/* ---------------- Rentals ---------------- */
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function rentalYearTotal(r, year){
  if(r.monthly && Array.isArray(r.monthly[year])){
    return r.monthly[year].reduce((sum,v)=>sum+(Number(v)||0),0);
  }
  // Fall back to legacy flat fields from before monthly tracking existed.
  const thisYear = new Date().getFullYear();
  if(year===thisYear) return Number(r.salesThisYear)||0;
  if(year===thisYear-1) return Number(r.salesLastYear)||0;
  return 0;
}

function rentalPctChange(r){
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  const ly = rentalYearTotal(r, lastYear);
  const ty = rentalYearTotal(r, thisYear);
  if(ly > 0) return Math.round(((ty-ly)/ly)*100);
  return ty > 0 ? 100 : 0;
}

function renderRentals(){
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  const rentalsSorted = rentals.slice().sort((a,b)=>{
    const va = vendorById(a.vendorId), vb = vendorById(b.vendorId);
    return (va?va.name:'').localeCompare(vb?vb.name:'');
  });

  const totalLastYear = rentals.reduce((sum,r)=>sum+rentalYearTotal(r,lastYear),0);
  const totalThisYear = rentals.reduce((sum,r)=>sum+rentalYearTotal(r,thisYear),0);
  const overallPct = totalLastYear>0 ? Math.round(((totalThisYear-totalLastYear)/totalLastYear)*100) : (totalThisYear>0?100:0);
  const growingCount = rentals.filter(r=>rentalPctChange(r)>=0).length;
  const decliningCount = rentals.length - growingCount;

  function rentalRow(r){
    const v = vendorById(r.vendorId);
    const pct = rentalPctChange(r);
    const growing = pct >= 0;
    const period = (r.dateFrom||r.dateTo) ? `${r.dateFrom||'—'} → ${r.dateTo||'—'}` : '—';
    const ly = rentalYearTotal(r, lastYear), ty = rentalYearTotal(r, thisYear);
    const hasMonthly = r.monthly && (Array.isArray(r.monthly[lastYear]) || Array.isArray(r.monthly[thisYear]));
    return `<tr>
      <td><strong>${escapeHtml(r.gondola||'—')}</strong><div class="mono" style="font-size:11px; color:var(--ink-dim); margin-top:2px;">${escapeHtml(period)}</div></td>
      <td>${escapeHtml(v?v.name:'Unknown vendor')}</td>
      <td class="mono">$${ly.toLocaleString()}</td>
      <td class="mono">$${ty.toLocaleString()}</td>
      <td><span class="badge ${growing?'badge-delivered':'badge-overdue'}">${pct>=0?'+':''}${pct}%</span></td>
      <td><span class="badge ${growing?'badge-delivered':'badge-overdue'}">${growing?'Recommend renewal':'Review before renewal'}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" data-action="edit-monthly" data-id="${r.id}">📅 Monthly${hasMonthly?'':' — not entered'}</button>
        <button class="btn btn-ghost btn-sm" data-action="edit-rental" data-id="${r.id}">Edit</button>
        <button class="btn btn-danger btn-sm" data-action="delete-rental" data-id="${r.id}">Delete</button>
      </td>
    </tr>`;
  }

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Rentals</div>
        <div class="page-sub">Gondola rental performance — ${lastYear} vs ${thisYear} sales, to guide renewal decisions.</div>
      </div>
      <button class="btn btn-amber" data-action="add-rental">+ Add Rental</button>
    </div>

    ${rentals.length ? `
    <div class="cards-row">
      <div class="stat-card c-teal"><div class="stat-num">${rentals.length}</div><div class="stat-label">Gondolas tracked</div></div>
      <div class="stat-card"><div class="stat-num">$${totalLastYear.toLocaleString()}</div><div class="stat-label">${lastYear} total sales</div></div>
      <div class="stat-card primary-stat" style="border-color:var(--primary);"><div class="stat-num">$${totalThisYear.toLocaleString()}</div><div class="stat-label">${thisYear} total sales</div></div>
      <div class="stat-card ${overallPct>=0?'c-green':'c-red'}"><div class="stat-num">${overallPct>=0?'+':''}${overallPct}%</div><div class="stat-label">Overall change</div></div>
    </div>
    <div class="cards-row" style="margin-top:-16px;">
      <div class="stat-card c-green"><div class="stat-num">${growingCount}</div><div class="stat-label">Growing — likely renew</div></div>
      <div class="stat-card c-red"><div class="stat-num">${decliningCount}</div><div class="stat-label">Declining — review</div></div>
    </div>
    ` : ''}

    <div class="panel">
      <div class="panel-header"><div class="panel-title">Gondola performance</div></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Gondola</th><th>Supplier</th><th>${lastYear} sales</th><th>${thisYear} sales</th><th>Change</th><th>Signal</th><th></th></tr></thead>
          <tbody>
          ${rentalsSorted.length ? rentalsSorted.map(rentalRow).join('') : `<tr><td colspan="7"><div class="empty-state">No rentals logged yet. Add a gondola to start tracking supplier performance.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function rentalFormModal(existing){
  const r = existing || { vendorId: vendors.length?vendors[0].id:'', gondola:'', dateFrom:'', dateTo:'' };
  openModal(`
    <div class="modal-header"><h3>${existing?'Edit Rental':'Add Rental'}</h3><span class="modal-close" data-action="close-modal">×</span></div>
    <div class="modal-body">
      <div id="rental-form">
        <div class="field">
          <label>Supplier</label>
          <select name="vendorId">
            ${vendors.length ? vendors.map(v=>`<option value="${v.id}" ${r.vendorId===v.id?'selected':''}>${escapeHtml(v.name)}</option>`).join('') : '<option value="">No vendors yet — add one in the Vendors tab first</option>'}
          </select>
        </div>
        <div class="field"><label>Gondola name / number</label><input name="gondola" value="${escapeHtml(r.gondola)}" placeholder="e.g. Gondola 3"></div>
        <div class="field-row">
          <div class="field"><label>Date from (optional)</label><input type="date" name="dateFrom" value="${r.dateFrom||''}"></div>
          <div class="field"><label>Date to (optional)</label><input type="date" name="dateTo" value="${r.dateTo||''}"></div>
        </div>
        <div class="hint">${existing?'Use the 📅 Monthly button on the rentals list to enter or update sales figures.':'After adding, use the 📅 Monthly button on the rentals list to enter month-by-month sales for both years.'}</div>
        <div class="hint" id="rental-form-error" style="color:var(--red); display:none;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-amber" id="rental-form-submit">${existing?'Save changes':'Add rental'}</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('rental-form-submit').addEventListener('click', ()=>{
    const root = document.getElementById('rental-form');
    const vendorId = root.querySelector('[name="vendorId"]').value;
    const gondola = root.querySelector('[name="gondola"]').value.trim();
    const dateFrom = root.querySelector('[name="dateFrom"]').value;
    const dateTo = root.querySelector('[name="dateTo"]').value;
    const errEl = document.getElementById('rental-form-error');
    if(!vendorId || !gondola){
      errEl.textContent = 'Please fill in supplier and gondola name.';
      errEl.style.display = 'block';
      return;
    }
    if(dateFrom && dateTo && dateTo < dateFrom){
      errEl.textContent = '"Date to" cannot be before "date from".';
      errEl.style.display = 'block';
      return;
    }
    const data = existing
      ? { ...existing, vendorId, gondola, dateFrom, dateTo }
      : { id:'r_'+Date.now()+Math.random().toString(36).slice(2,7), vendorId, gondola, dateFrom, dateTo, monthly:{} };
    if(existing){
      const idx = rentals.findIndex(x=>x.id===existing.id);
      rentals[idx] = data;
    } else {
      rentals.push(data);
    }
    saveData();
    closeModal();
    if(!existing) monthlyBreakdownModal(data.id);
    else render();
  });
}

function monthlyBreakdownModal(rentalId){
  const r = rentals.find(x=>x.id===rentalId);
  if(!r) return;
  const v = vendorById(r.vendorId);
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  const lyVals = (r.monthly && Array.isArray(r.monthly[lastYear])) ? r.monthly[lastYear] : Array(12).fill(0);
  const tyVals = (r.monthly && Array.isArray(r.monthly[thisYear])) ? r.monthly[thisYear] : Array(12).fill(0);

  openModal(`
    <div class="modal-header"><h3>Monthly Sales — ${escapeHtml(r.gondola||'Gondola')}</h3><span class="modal-close" data-action="close-modal">×</span></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:10px;">${escapeHtml(v?v.name:'Unknown vendor')} — enter sales for each month. Yearly totals and % change update automatically.</div>
      <div id="monthly-form">
        <div style="display:flex; gap:10px; padding:0 0 6px 0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-dim);">
          <div style="width:44px;">Month</div>
          <div style="flex:1;">${lastYear}</div>
          <div style="flex:1;">${thisYear}</div>
        </div>
        <div style="max-height:340px; overflow-y:auto;">
          ${MONTH_NAMES.map((m,i)=>`
          <div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line);">
            <div style="width:44px; font-size:13px; font-weight:600;">${m}</div>
            <input type="number" min="0" step="0.01" data-year="${lastYear}" data-month="${i}" value="${lyVals[i]||0}" style="flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;">
            <input type="number" min="0" step="0.01" data-year="${thisYear}" data-month="${i}" value="${tyVals[i]||0}" style="flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;">
          </div>`).join('')}
        </div>
        <div style="display:flex; gap:10px; padding-top:8px; font-size:12px; font-weight:700; color:var(--ink-dim);">
          <div style="width:44px;">Total</div>
          <div style="flex:1;" id="monthly-total-ly" class="mono"></div>
          <div style="flex:1;" id="monthly-total-ty" class="mono"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-amber" id="monthly-form-submit">Save monthly sales</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('modal-box').style.maxWidth = '600px';

  const root = document.getElementById('monthly-form');
  const lyTotalEl = document.getElementById('monthly-total-ly');
  const tyTotalEl = document.getElementById('monthly-total-ty');
  function recalcTotals(){
    let lySum = 0, tySum = 0;
    root.querySelectorAll('input[data-year]').forEach(inp=>{
      const val = Number(inp.value)||0;
      if(Number(inp.dataset.year)===lastYear) lySum += val; else tySum += val;
    });
    lyTotalEl.textContent = '$'+lySum.toLocaleString();
    tyTotalEl.textContent = '$'+tySum.toLocaleString();
  }
  root.querySelectorAll('input[data-year]').forEach(inp=>inp.addEventListener('input', recalcTotals));
  recalcTotals();

  document.getElementById('monthly-form-submit').addEventListener('click', ()=>{
    const newLy = Array(12).fill(0);
    const newTy = Array(12).fill(0);
    root.querySelectorAll('input[data-year]').forEach(inp=>{
      const year = Number(inp.dataset.year);
      const month = Number(inp.dataset.month);
      const val = Number(inp.value)||0;
      if(year===lastYear) newLy[month]=val; else if(year===thisYear) newTy[month]=val;
    });
    r.monthly = r.monthly || {};
    r.monthly[lastYear] = newLy;
    r.monthly[thisYear] = newTy;
    // Keep legacy flat fields in sync too, harmless if unused.
    r.salesLastYear = newLy.reduce((a,b)=>a+b,0);
    r.salesThisYear = newTy.reduce((a,b)=>a+b,0);
    saveData();
    closeModal();
    render();
  });
}

function attachMainEvents(){
  document.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.addEventListener('click', closeModal));
  const gotoToday = document.querySelector('[data-action="goto-today"]');
  if(gotoToday) gotoToday.addEventListener('click', ()=>{ state.tab='today'; state.todayViewDate=todayStr(); render(); });
  document.querySelectorAll('[data-action="today-tab"]').forEach(el=>el.addEventListener('click', ()=>{ state.todaySubtab=el.dataset.subtab; render(); }));

  document.querySelectorAll('[data-action="add-vendor"]').forEach(el=>el.addEventListener('click', ()=>vendorFormModal(null)));
  document.querySelectorAll('[data-action="import-excel"]').forEach(el=>el.addEventListener('click', triggerImportFile));
  document.querySelectorAll('[data-action="download-template"]').forEach(el=>el.addEventListener('click', downloadTemplate));
  const fileInput = document.getElementById('excel-file-input');
  if(fileInput) fileInput.addEventListener('change', handleImportFile);
  document.querySelectorAll('[data-action="edit-vendor"]').forEach(el=>el.addEventListener('click', ()=>vendorFormModal(vendorById(el.dataset.id))));
  document.querySelectorAll('[data-action="delete-vendor"]').forEach(el=>el.addEventListener('click', ()=>{

  }));
  document.querySelectorAll('[data-action="place-order"]').forEach(el=>el.addEventListener('click', ()=>attemptPlaceOrder(el.dataset.id)));
  document.querySelectorAll('[data-action="deliver"]').forEach(el=>el.addEventListener('click', ()=>deliverModal(el.dataset.id)));
  document.querySelectorAll('[data-action="delete-order"]').forEach(el=>el.addEventListener('click', ()=>{
    if(confirm('Delete this order record?')){
      orders = orders.filter(o=>o.id!==el.dataset.id);
      saveData(); render();
    }
  }));

  document.querySelectorAll('[data-action="add-rental"]').forEach(el=>el.addEventListener('click', ()=>rentalFormModal(null)));
  document.querySelectorAll('[data-action="edit-rental"]').forEach(el=>el.addEventListener('click', ()=>rentalFormModal(rentals.find(r=>r.id===el.dataset.id))));
  document.querySelectorAll('[data-action="edit-monthly"]').forEach(el=>el.addEventListener('click', ()=>monthlyBreakdownModal(el.dataset.id)));
  document.querySelectorAll('[data-action="delete-rental"]').forEach(el=>el.addEventListener('click', ()=>{
    if(confirm('Delete this rental record?')){
      rentals = rentals.filter(r=>r.id!==el.dataset.id);
      saveData(); render();
    }
  }));

  document.querySelectorAll('[data-action="no-order"]').forEach(el=>el.addEventListener('click', ()=>{
    addSkip(el.dataset.id, el.dataset.date);
    render();
  }));
  document.querySelectorAll('[data-action="undo-skip"]').forEach(el=>el.addEventListener('click', ()=>{
    removeSkip(el.dataset.id, el.dataset.date);
    render();
  }));

  const vendorSearchInput = document.getElementById('vendor-search-input');
  if(vendorSearchInput){
    vendorSearchInput.addEventListener('input', (e)=>{
      state.vendorSearch = e.target.value;
      filterRowsBySearch('#vendor-list', state.vendorSearch, '#vendor-no-match');
    });
  }
  const todaySearchInput = document.getElementById('today-search-input');
  if(todaySearchInput){
    todaySearchInput.addEventListener('input', (e)=>{
      state.todaySearch = e.target.value;
      filterRowsBySearch('#today-awaiting-list', state.todaySearch, '#today-awaiting-no-match');
      filterRowsBySearch('#today-scheduled-list', state.todaySearch, '#today-scheduled-no-match');
      filterRowsBySearch('#today-skipped-list', state.todaySearch, '#today-skipped-no-match');
      filterRowsBySearch('#today-other-list', state.todaySearch, '#today-no-match');
    });
  }
  if(state.vendorSearch) filterRowsBySearch('#vendor-list', state.vendorSearch, '#vendor-no-match');
  if(state.todaySearch){
    filterRowsBySearch('#today-awaiting-list', state.todaySearch, '#today-awaiting-no-match');
    filterRowsBySearch('#today-scheduled-list', state.todaySearch, '#today-scheduled-no-match');
    filterRowsBySearch('#today-skipped-list', state.todaySearch, '#today-skipped-no-match');
    filterRowsBySearch('#today-other-list', state.todaySearch, '#today-no-match');
  }

  const prev = document.querySelector('[data-action="date-prev"]');
  const next = document.querySelector('[data-action="date-next"]');
  const todayBtn = document.querySelector('[data-action="date-today"]');
  if(prev) prev.addEventListener('click', ()=>{ state.todayViewDate = addDays(state.todayViewDate,-1); render(); });
  if(next) next.addEventListener('click', ()=>{ state.todayViewDate = addDays(state.todayViewDate,1); render(); });
  if(todayBtn) todayBtn.addEventListener('click', ()=>{ state.todayViewDate = todayStr(); render(); });

  const weekPrev = document.querySelector('[data-action="week-prev"]');
  const weekNext = document.querySelector('[data-action="week-next"]');
  const weekTodayBtn = document.querySelector('[data-action="week-today"]');
  if(weekPrev) weekPrev.addEventListener('click', ()=>{ state.warehouseWeekStart = addDays(state.warehouseWeekStart || startOfWeek(todayStr()), -7); render(); });
  if(weekNext) weekNext.addEventListener('click', ()=>{ state.warehouseWeekStart = addDays(state.warehouseWeekStart || startOfWeek(todayStr()), 7); render(); });
  if(weekTodayBtn) weekTodayBtn.addEventListener('click', ()=>{ state.warehouseWeekStart = startOfWeek(todayStr()); render(); });
}

async function pollRemoteChanges(){
  if(!SUPABASE_ENABLED) return 'disabled';
  const modalOpen = document.getElementById('modal-overlay').classList.contains('open');
  if(modalOpen) return 'skipped';
  try{
    const payload = await supabaseGetPayload();
    state.lastSyncCheckAt = new Date();
    if(!payload){ updateStorageStatusUI(); return 'unchanged'; }
    const incoming = JSON.stringify({vendors:payload.vendors||[], orders:payload.orders||[], skips:payload.skips||[], rentals:payload.rentals||[]});
    const current = JSON.stringify({vendors, orders, skips, rentals});
    if(incoming !== current){
      vendors = payload.vendors || [];
      orders = payload.orders || [];
      skips = payload.skips || [];
      rentals = payload.rentals || [];
      storageMode = 'supabase';
      updateStorageStatusUI();
      render();
      return 'changed';
    }
    updateStorageStatusUI();
    return 'unchanged';
  }catch(e){
    console.error('Background sync check failed', e);
    return 'failed';
  }
}
setInterval(pollRemoteChanges, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollRemoteChanges(); });
// Keep the "synced Xs ago" text fresh even when nothing has changed.
setInterval(()=>{ if(state.lastSyncCheckAt) updateStorageStatusUI(); }, 10000);

document.getElementById('sync-now-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('sync-now-btn');
  if(!SUPABASE_ENABLED){
    btn.textContent = '⟳ No cloud sync configured';
    setTimeout(()=>{ btn.textContent = '⟳ Sync now'; }, 2000);
    return;
  }
  btn.disabled = true;
  btn.textContent = '⟳ Syncing…';
  const result = await pollRemoteChanges();
  if(result==='changed') btn.textContent = '✓ Updated';
  else if(result==='unchanged') btn.textContent = '✓ Already up to date';
  else if(result==='failed') btn.textContent = '⚠ Sync failed — check connection';
  else btn.textContent = '⟳ Sync now';
  setTimeout(()=>{ btn.textContent = '⟳ Sync now'; btn.disabled = false; }, 1800);
});

loadData();
